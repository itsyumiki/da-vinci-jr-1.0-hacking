[package]
name = "da-vinci-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
da-vinci-protocol.workspace = true
iced = { version = "0.14.0", default-features = false, features = ["smol"] }
serialport = "4.10.0"

[target.'cfg(target_os = "macos")'.dependencies]
iced = { version = "0.14.0", default-features = false, features = ["wgpu"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia"] }

[target.'cfg(target_os = "linux")'.dependencies]
iced = { version = "0.14.0", default-features = false, features = ["wayland", "x11"] }
