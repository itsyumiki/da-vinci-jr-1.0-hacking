[package]
name = "da-vinci-firmware"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["sam4e8e"]
sam4e8e = ["dep:atsam4-hal", "dep:cortex-m-rt", "dep:nb", "dep:panic-halt", "dep:usbd-serial"]
lpc1115 = ["dep:cortex-m-rt", "dep:lpc11xx", "dep:panic-halt"]

[dependencies]
da-vinci-protocol.workspace = true

[target.'cfg(target_arch = "arm")'.dependencies]
atsam4-hal = { version = "0.3.1", default-features = false, features = ["atsam4e8e", "usb"], optional = true }
cortex-m-rt = { version = "0.7.6", optional = true }
lpc11xx = { version = "0.2.0", optional = true }
nb = { version = "0.1.3", optional = true }
panic-halt = { version = "1.0.0", optional = true }
usbd-serial = { version = "0.1.1", optional = true }

[[bin]]
name = "da-vinci-firmware"
path = "src/main.rs"
required-features = ["sam4e8e"]

[[bin]]
name = "da-vinci-lpc1115"
path = "src/bin/lpc1115.rs"
required-features = ["lpc1115"]
