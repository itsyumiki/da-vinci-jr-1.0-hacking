name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build desktop controller
        run: cargo build --manifest-path gpiodemo/Cargo.toml -p da-vinci-gui --release

      - name: Upload desktop controller
        uses: actions/upload-artifact@v7
        with:
          name: da-vinci-gui-macos
          path: gpiodemo/target/release/da-vinci-gui
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends gcc-arm-none-eabi just
          rustup target add thumbv7em-none-eabi

      - name: Build firmware
        run: just build

      - name: Set artifact timestamp
        id: timestamp
        run: echo "value=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Upload firmware bundle
        uses: actions/upload-artifact@v7
        with:
          name: sam4e8e-firmware-${{ steps.timestamp.outputs.value }}
          path: |
            build/firmware.elf
            build/firmware.bin
            build/firmware.map
          if-no-files-found: error

      - name: Upload firmware binary
        uses: actions/upload-artifact@v7
        with:
          name: sam4e8e-firmware-bin-${{ steps.timestamp.outputs.value }}
          path: build/firmware.bin
          if-no-files-found: error
